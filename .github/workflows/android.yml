name: Android

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    name: Source integrity checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check tools and native language packs
        run: |
          python3 -m unittest discover -s tools -p test_ci.py
          python3 -m unittest discover -s tools -p test_update_feed.py
          python3 -m unittest discover -s tools -p test_debian_sbom.py
          python3 -m unittest discover -s tools -p test_debian_sources.py
          python3 -m unittest discover -s tools -p test_native_i18n.py
          node --test tools/test_lsp.mjs
          bash -n tools/ci_prepare_assets.sh tools/ci_sign_apk.sh tools/ci_release_draft.sh tools/ci_debian_sources.sh

  runtime:
    name: Pinned ARM64 runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: runtime-cache
        with:
          path: |
            app/runtime-assets/arm64-v8a
            app/src/main/jniLibs/arm64-v8a
            app/src/main/assets/terminal/vendor
            .cache/ci-native-sources.tar.gz
          key: runtime-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('runtime/**', 'native-host/**', 'tools/build_opencode.py', 'tools/bundle_*.py', 'tools/prepare_*.py', 'tools/devkit_*', 'tools/register_arm64_binfmt.py', 'tools/verify_ci_assets.py', 'tools/ci_prepare_assets.sh', 'tools/package_native_sources.py', '.github/workflows/android.yml') }}
      - name: Read locked Bun version
        id: bun
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: python3 -c 'import json,os; v=json.load(open("runtime/opencode-dev.lock.json"))["bunVersion"]; open(os.environ["GITHUB_OUTPUT"],"a").write("version="+v+"\n")'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Linux build tools
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static binfmt-support make curl xz-utils
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;29.0.14206865'
      - name: Build immutable source inputs
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK="${ANDROID_HOME}/ndk/29.0.14206865"
          bash tools/ci_prepare_assets.sh
          python3 tools/package_native_sources.py
      - name: Validate cached or rebuilt inputs
        run: python3 tools/verify_ci_assets.py
      - name: Package runtime inputs
        run: |
          tar -cf .cache/ci-runtime-inputs.tar app/runtime-assets/arm64-v8a app/src/main/jniLibs/arm64-v8a app/src/main/assets/terminal/vendor
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: arm64-runtime-inputs
          path: |
            .cache/ci-runtime-inputs.tar
            .cache/ci-native-sources.tar.gz
          include-hidden-files: true
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  android:
    name: Build and check APKs
    needs: [runtime, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: arm64-runtime-inputs
          path: .cache/ci-inputs
      - name: Restore and check runtime
        run: |
          tar -xf .cache/ci-inputs/ci-runtime-inputs.tar
          python3 tools/verify_ci_assets.py
      - name: Prepare SDK
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;26.1.10909125' 'cmake;3.22.1'
      - name: Record replayable build inputs
        id: version
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: python3 tools/ci_build_info.py --tag "$RELEASE_TAG" --output artifacts/build-info.json
      - name: Compile, unit test and lint
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          bash gradlew assembleDebug assembleDebugAndroidTest assembleRelease testDebugUnitTest lintDebug lintRelease --no-daemon --console=plain -PappVersionName="$VERSION_NAME" -PappVersionCode="$VERSION_CODE"
      - name: Verify APK contracts and collect outputs
        run: |
          python3 tools/check_apk.py app/build/outputs/apk/debug/app-debug.apk --sdk "$ANDROID_HOME"
          python3 tools/check_apk.py app/build/outputs/apk/release/app-release-unsigned.apk --sdk "$ANDROID_HOME"
          bash gradlew app:dependencies --configuration releaseRuntimeClasspath --no-daemon --console=plain > artifacts/gradle-runtime-dependencies.txt
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/opencode-android-full-arm64-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk artifacts/opencode-android-full-arm64-test.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/opencode-android-full-arm64-unsigned.apk
          cp .cache/ci-inputs/ci-native-sources.tar.gz artifacts/
          cp THIRD_PARTY_NOTICES.md artifacts/
          cp runtime/developer-packages-arm64.tsv artifacts/
          cp runtime/developer-deb-lock.json artifacts/
          python3 tools/debian_sbom.py --apk artifacts/opencode-android-full-arm64-unsigned.apk --output artifacts/debian-unsigned
          python3 tools/prepare_update.py --output artifacts/opencode-update-manifest.json
          cp app/runtime-assets/arm64-v8a/runtime/opencode.pack artifacts/opencode-update.pack
          git archive --format=tar --prefix=opencode-android-full/ HEAD | gzip -n > artifacts/opencode-android-full-source.tar.gz
          (cd artifacts && sha256sum *.apk *.tar.gz *.json *.tsv *.md *.pack gradle-runtime-dependencies.txt debian-unsigned/*.json debian-unsigned/*.zip > SHA256SUMS.txt)
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .cache/debian-source-objects
            .cache/developer-mirror
            .cache/upstream-source-objects
          key: corresponding-sources-v1-${{ hashFiles('runtime/debian-source-archive-lock.json', 'runtime/upstream-source-lock.json') }}
      - name: Verify and package exact Debian corresponding sources
        run: |
          bash tools/ci_debian_sources.sh
          python3 tools/upstream_sources.py --output .cache/upstream-source-delivery
          cp .cache/upstream-source-delivery/* artifacts/
          (cd artifacts && sha256sum *.apk *.tar.gz *.json *.tsv *.md *.pack gradle-runtime-dependencies.txt debian-unsigned/*.json debian-unsigned/*.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-arm64-${{ github.sha }}
          path: artifacts/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: android-check-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14

  release:
    name: Sign and publish engineering prerelease
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: android-arm64-${{ github.sha }}
          path: artifacts/
      - name: Prepare signing SDK
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'
      - name: Sign APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash tools/ci_sign_apk.sh
      - name: Publish engineering prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash tools/ci_release_draft.sh
